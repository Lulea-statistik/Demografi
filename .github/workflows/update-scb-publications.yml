name: Uppdatera SCB:s publiceringskalender

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
      timezone: 'Europe/Stockholm'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera kalenderberoenden
        run: python -m pip install requests beautifulsoup4
      - name: Läs nästa månadsvisa publicering från SCB
        run: python scripts/update_scb_publications.py
      - name: Publicera ändrade datum
        run: |
          if ! git diff --quiet -- scb_publications.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scb_publications.json
            git commit -m "Update SCB population publication dates"
            git push
          fi
