name: Kontrollera SCB:s nya manadsstatistik

on:
  workflow_dispatch:
  schedule:
    - cron: '5,10,15,20,25,30 8 * * *'
      timezone: 'Europe/Stockholm'
    - cron: '0 9,10,11 * * *'
      timezone: 'Europe/Stockholm'

permissions:
  contents: write

concurrency:
  group: scb-monthly-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera beroenden
        run: python -m pip install requests
      - name: Kontrollera publiceringsdag och SCB:s tidsdimension
        run: python scripts/check_scb_monthly_release.py
      - name: Publicera enbart verifierad ny statistikperiod
        run: |
          if ! git diff --quiet -- scb_data_status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scb_data_status.json
            git commit -m "Confirm newly available SCB monthly period"
            git pull --rebase
            git push
          fi
